# This is a simplified version of the schema for demonstration purposes.

---
vxlan: include('vxlan', required=False)
defaults: any(required=False)
---
vxlan:
  fabric: include('fabric', required=False)
  global: include('global', required=False)
  topology: include('topology', required=False)
  underlay: include('underlay', required=False)
  overlay: include('overlay', required=False)

fabric:
  name: regex('^[a-zA-Z][a-zA-Z0-9_-]{0,63}$')
  type: enum('VXLAN_EVPN', 'MSD', 'MCFG', 'ISN', 'External', 'eBGP_VXLAN')

global:
  ebgp: include('global_ebgp', required=False)
  ibgp: include('global_ibgp', required=False)
  external: include('global_external', required=False)

# iBGP EVPN fabric (VXLAN_EVPN)
global_ibgp:
  bgp_asn: regex(r'^(?:\d{1,10}|\d{1,5}\.\d{1,5})$')
  route_reflectors: enum(2, 4, required=False)
  anycast_gateway_mac: >
    any(
      regex('^[a-f0-9]{1}\.[a-f0-9]{1}\.[a-f0-9]{1}$', required=False),
      regex('^[a-f0-9]{4}\.[a-f0-9]{4}\.[a-f0-9]{4}$', required=False),
      regex('^[a-f0-9]{2}:[a-f0-9]{2}:[a-f0-9]{2}:[a-f0-9]{2}:[a-f0-9]{2}:[a-f0-9]{2}$', required=False),
      regex('^[a-f0-9]{2}-[a-f0-9]{2}-[a-f0-9]{2}-[a-f0-9]{2}-[a-f0-9]{2}-[a-f0-9]{2}$', required=False),
      required=False
    )
  dns_servers: list(include('common_dns_server'), min=0, max=4, required=False)
  ntp_servers: list(include('common_ntp_server'), min=0, max=4, required=False)
  syslog_servers: list(include('common_syslog_server'), min=0, max=4, required=False)
  overlay_mode: enum('cli', 'config-profile', required=False)
  greenfield_cleanup: enum('Enable', 'Disable', required=False)

# eBGP EVPN fabric (eBGP_VXLAN)
global_ebgp:
  spine_bgp_asn: regex(r'^(?:\d{1,10}|\d{1,5}\.\d{1,5})$')
  bgp_asn_mode: enum('Multi-AS', 'Same-Tier-AS', required=False)
  anycast_gateway_mac: >
    any(
      regex('^[a-f0-9]{1}\.[a-f0-9]{1}\.[a-f0-9]{1}$', required=False),
      regex('^[a-f0-9]{4}\.[a-f0-9]{4}\.[a-f0-9]{4}$', required=False),
      regex('^[a-f0-9]{2}:[a-f0-9]{2}:[a-f0-9]{2}:[a-f0-9]{2}:[a-f0-9]{2}:[a-f0-9]{2}$', required=False),
      regex('^[a-f0-9]{2}-[a-f0-9]{2}-[a-f0-9]{2}-[a-f0-9]{2}-[a-f0-9]{2}-[a-f0-9]{2}$', required=False),
      required=False
    )
  overlay_mode: enum('cli', 'config-profile', required=False)

# External fabric
global_external:
  bgp_asn: regex(r'^(?:\d{1,10}|\d{1,5}\.\d{1,5})$')

# Manageability servers
common_dns_server:
  ip_address: ip()
  vrf: str()

common_ntp_server:
  ip_address: ip()
  vrf: str()

common_syslog_server:
  ip_address: ip()
  vrf: str()
  severity: int(min=0, max=7)

# Topology section
topology:
  switches: list(include('topology_switch'), required=False)

topology_switch:
  name: str()
  serial_number: regex('^[a-zA-Z0-9_.:-]{1,16}$', required=False)
  role: enum('spine', 'leaf', 'border', 'border_spine', 'border_gateway', 'border_gateway_spine', 'super_spine', 'border_super_spine', 'border_gateway_super_spine', 'tor', 'core_router', 'edge_router', required=False)
  management: include('topology_switch_management', required=False)

topology_switch_management:
  default_gateway_v4: ip(version=4, required=False)
  default_gateway_v6: ip(version=6, required=False)
  management_ipv4_address: ip(version=4, required=False)
  management_ipv6_address: ip(version=6, required=False)
  subnet_mask_ipv4: int(min=8, max=30, required=False)
  subnet_mask_ipv6: int(min=16, max=128, required=False)
  username: str(required=False)
  password: str(required=False)

# Underlay section
underlay:
  general: include('underlay_general', required=False)
  ipv4: include('underlay_ipv4', required=False)
  ipv6: include('underlay_ipv6', required=False)
  ospf: include('underlay_ospf', required=False)
  multicast: include('underlay_multicast', required=False)

underlay_general:
  routing_protocol: enum('ospf', 'is-is', required=False)
  enable_ipv6_underlay: bool(required=False)
  replication_mode: enum('multicast', 'ingress', required=False)
  manual_underlay_allocation: bool(required=False)
  underlay_routing_loopback_id: int(min=0, max=1023, required=False)
  underlay_vtep_loopback_id: int(min=0, max=1023, required=False)
  underlay_routing_protocol_tag: str(required=False)
  intra_fabric_interface_mtu: int(max=9216, required=False)
  layer2_host_interface_mtu: int(max=9216, required=False)
  unshut_host_interfaces: bool(required=False)

underlay_ipv4:
  fabric_interface_numbering: enum('p2p', 'unnumbered', required=False)
  subnet_mask: int(min=30, max=31, required=False)
  underlay_routing_loopback_ip_range: ip(version=4, required=False)
  underlay_vtep_loopback_ip_range: ip(version=4, required=False)
  underlay_rp_loopback_ip_range: ip(version=4, required=False)
  underlay_subnet_ip_range: ip(version=4, required=False)

underlay_ipv6:
  enable_ipv6_link_local_address: bool(required=False)
  underlay_subnet_mask: enum(126, 127, required=False)

underlay_ospf:
  area_id: str(required=False)
  authentication_enable: bool(required=False)
  authentication_key_id: int(min=0, max=255, required=False)
  authentication_key: str(required=False)

underlay_multicast:
  rendezvous_points: enum(2, 4, required=False)
  rp_mode: enum('asm', 'bidir', required=False)
  underlay_rp_loopback_id: int(min=0, max=1023, required=False)
  underlay_primary_rp_loopback_id: int(min=0, max=1023, required=False)

# Overlay section
overlay:
  vrfs: list(include('overlay_vrfs'), required=False)
  networks: list(include('overlay_networks'), required=False)
  vrf_attach_groups: list(include('overlay_vrf_attach_group'), required=False)
  network_attach_groups: list(include('overlay_network_attach_group'), required=False)

# VRF definition
overlay_vrfs:
  name: str()
  vrf_id: int(min=1, max=16777214, required=False)
  vlan_id: int(min=1, max=4094, required=False)
  vrf_attach_group: str(required=False)

# Network definition
overlay_networks:
  name: str()
  vrf_name: str(required=False)
  net_id: int(min=1, max=16777214, required=False)
  vlan_id: int(min=1, max=4094, required=False)
  vlan_name: str(required=False)
  int_desc: str(required=False)
  gw_ip_address: ip(version=4, required=False)
  gw_ipv6_address: str(required=False)
  mtu_l3intf: int(required=False)
  route_target_both: bool(required=False)
  l3gw_on_border: bool(required=False)
  network_attach_group: str(required=False)

# VRF attach groups
overlay_vrf_attach_group:
  name: str()
  switches: list(include('overlay_vrf_attach_group_switch'), required=False)

overlay_vrf_attach_group_switch:
  hostname: str()

# Network attach groups
overlay_network_attach_group:
  name: str()
  switches: list(include('overlay_network_attach_group_switch'), required=False)

overlay_network_attach_group_switch:
  hostname: str()
  ports: list(regex(r'(?i)^(?:e|eth(?:ernet)?)((\d)/\d{1,3})$|^(?:po|port-channel)([1-9]|[1-9][0-9]{1,2}|[1-3][0-9]{3}|40[0-8][0-9]|409[0-6])$'), required=False)
